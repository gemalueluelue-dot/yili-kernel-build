name: Build yili Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Checkout kernel source
        run: |
          git clone --depth=1 -b yili-w-oss https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel
          cd kernel
          git log -1 --oneline
          ls -la

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libssl-dev libelf-dev \
            zip rsync python3 git curl cpio kmod libncurses-dev device-tree-compiler

      - name: Fetch clang toolchain
        run: |
          mkdir -p $HOME/toolchain && cd $HOME/toolchain
          curl -L -o clang.tar.gz https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r536225.tar.gz
          mkdir -p clang && tar -xzf clang.tar.gz -C clang
          $HOME/toolchain/clang/bin/clang --version

      - name: Build kernel
        run: |
          cd kernel
          export PATH=$HOME/toolchain/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          DEFCONFIG=arch/arm64/configs/mgk_64_k612_defconfig
          if [ ! -f "$DEFCONFIG" ]; then
            echo "defconfig not found, searching..."; find . -name "*k612*defconfig" -o -name "*yili*defconfig" | head -20
            DEFCONFIG=$(find . -name "mgk_64_k612_defconfig" | head -1)
          fi
          echo "Using defconfig: $DEFCONFIG"
          make O=out ARCH=arm64 $DEFCONFIG
          make -j$(nproc) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 2>&1 | tail -100

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p result
          find kernel/out/arch/arm64/boot -maxdepth 1 -type f -exec cp {} result/ \; 2>/dev/null || true
          ls -la result/ || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yili-kernel-image
          path: result/*
